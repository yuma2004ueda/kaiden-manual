<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>架電ディレクション管理チャット</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #252836;
    --border: #2e3148;
    --accent: #7c6af7;
    --accent-hover: #6957e8;
    --text: #e2e4f0;
    --text-muted: #8a8fa8;
    --success: #4caf7d;
    --error: #f06464;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== パスワード画面 ===== */
  #lockScreen {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 24px;
  }
  .lock-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }
  .lock-icon { font-size: 48px; margin-bottom: 16px; }
  .lock-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .lock-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }
  .lock-input {
    width: 100%;
    padding: 12px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color .2s;
    margin-bottom: 12px;
    text-align: center;
    letter-spacing: 2px;
  }
  .lock-input:focus { border-color: var(--accent); }
  .lock-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
  }
  .lock-btn:hover { opacity: .85; }
  .lock-error {
    margin-top: 12px;
    font-size: 13px;
    color: var(--error);
    min-height: 20px;
  }

  /* ===== チャット画面 ===== */
  #chatScreen {
    display: none;
    flex-direction: column;
    height: 100vh;
  }

  /* ヘッダー */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .header h1 { font-size: 16px; font-weight: 600; }
  .header .badge {
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 600;
  }
  .header-links {
    margin-left: auto;
    display: flex;
    gap: 12px;
    font-size: 12px;
  }
  .header-links a {
    color: var(--text-muted);
    text-decoration: none;
    transition: color .2s;
  }
  .header-links a:hover { color: var(--accent); }

  /* メインレイアウト */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* パネル共通 */
  .panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  /* テンプレートパネル */
  .template-panel { width: 220px; flex-shrink: 0; }
  .template-list { overflow-y: auto; flex: 1; padding: 8px; }
  .tmpl-group { margin-bottom: 12px; }
  .tmpl-group-label {
    font-size: 10px;
    color: var(--text-muted);
    padding: 4px 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .tmpl-item {
    padding: 9px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s;
    margin-bottom: 2px;
  }
  .tmpl-item:hover { background: var(--surface2); }
  .tmpl-item.active { background: var(--accent); color: #fff; }
  .tmpl-item .tmpl-icon { margin-right: 8px; }

  /* 変数入力パネル */
  .vars-panel { width: 260px; flex-shrink: 0; }
  .vars-body { padding: 12px; overflow-y: auto; flex: 1; }
  .field-group { margin-bottom: 14px; }
  .field-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 5px;
    display: block;
  }
  .field-required { color: var(--error); margin-left: 2px; }
  select, input[type="text"], input[type="number"], textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
    font-family: inherit;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 60px; }
  .send-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 4px;
  }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled { background: var(--border); cursor: not-allowed; }

  /* チャットパネル */
  .chat-panel {
    flex: 1;
    border-right: none;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-history {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { display: flex; gap: 10px; max-width: 90%; }
  .msg.user { flex-direction: row-reverse; align-self: flex-end; }
  .msg-bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.6;
    max-width: 100%;
    word-break: break-word;
  }
  .msg.user .msg-bubble {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .msg-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .msg.user .msg-avatar { background: var(--accent); border-color: var(--accent); }

  /* チャット入力 */
  .chat-input-row {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .chat-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    font-family: inherit;
  }
  .chat-input:focus { border-color: var(--accent); }
  .chat-send-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .chat-send-btn:hover { background: var(--accent-hover); }
  .chat-send-btn:disabled { background: var(--border); cursor: not-allowed; }

  /* Markdownテーブル */
  .msg-bubble table {
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 12px;
    width: 100%;
  }
  .msg-bubble th, .msg-bubble td {
    border: 1px solid var(--border);
    padding: 5px 8px;
    text-align: left;
  }
  .msg-bubble th { background: var(--surface); }
  .msg-bubble strong { font-weight: 600; }
  .msg-bubble code {
    background: var(--bg);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11px;
    font-family: monospace;
  }

  /* ローディング */
  .typing { display: flex; gap: 4px; align-items: center; padding: 6px 0; }
  .typing span {
    width: 6px; height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

  /* レスポンシブ */
  @media (max-width: 700px) {
    .template-panel { display: none; }
    .vars-panel { width: 100%; max-width: 280px; }
  }
  @media (max-width: 500px) {
    .vars-panel { display: none; }
  }
</style>
</head>
<body>

<!-- パスワード画面 -->
<div id="lockScreen">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">架電ディレクション管理チャット</div>
    <div class="lock-sub">社内専用システムです。アクセスパスワードを入力してください。</div>
    <input type="password" id="pwInput" class="lock-input" placeholder="パスワード" autocomplete="off">
    <button class="lock-btn" onclick="checkPassword()">アクセス</button>
    <div class="lock-error" id="pwError"></div>
  </div>
</div>

<!-- チャット画面 -->
<div id="chatScreen">
  <div class="header">
    <span style="font-size:20px">📞</span>
    <h1>架電ディレクション管理チャット</h1>
    <span class="badge">Dify AI</span>
    <div class="header-links">
      <a href="index.html">📖 取扱説明書</a>
      <a href="#" onclick="logout(); return false;">🔒 ログアウト</a>
    </div>
  </div>

  <div class="main">

    <!-- テンプレートパネル -->
    <div class="panel template-panel">
      <div class="panel-header">テンプレート</div>
      <div class="template-list" id="templateList"></div>
    </div>

    <!-- 変数入力パネル -->
    <div class="panel vars-panel">
      <div class="panel-header">入力フォーム</div>
      <div class="vars-body" id="varsBody">
        <p style="color:var(--text-muted);font-size:13px;padding:8px 0;">← テンプレートを選択してください</p>
      </div>
    </div>

    <!-- チャットパネル -->
    <div class="panel chat-panel">
      <div class="panel-header">チャット履歴</div>
      <div class="chat-history" id="chatHistory">
        <div class="msg bot">
          <div class="msg-avatar">🤖</div>
          <div class="msg-bubble">こんにちは！架電ディレクションの管理をサポートします。左のテンプレートを選ぶか、直接メッセージを入力してください。</div>
        </div>
      </div>
      <div class="chat-input-row">
        <input type="text" class="chat-input" id="chatInput" placeholder="メッセージを入力…" />
        <button class="chat-send-btn" id="chatSendBtn" onclick="sendDirectMessage()">送信</button>
      </div>
    </div>

  </div>
</div>

<script>
// ===== パスワード認証 =====
const HASH = '16c6d577e0ebc0c145dd3d93220d23d64449c5037e66d70191988dcee644582a';
const SESSION_KEY = 'kaiden_auth';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPassword() {
  const pw = document.getElementById('pwInput').value;
  const err = document.getElementById('pwError');
  if (!pw) { err.textContent = 'パスワードを入力してください'; return; }
  const h = await sha256(pw);
  if (h === HASH) {
    sessionStorage.setItem(SESSION_KEY, '1');
    showChat();
  } else {
    err.textContent = 'パスワードが正しくありません';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

function showChat() {
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'flex';
  initChat();
}

function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('lockScreen').style.display = 'flex';
  document.getElementById('chatScreen').style.display = 'none';
  document.getElementById('pwInput').value = '';
}

document.getElementById('pwInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkPassword();
});

// ===== テンプレート定義 =====
const TEMPLATES = [
  {
    id: 'assign_direction',
    group: 'ディレクション',
    icon: '📋',
    label: 'ディレクション作成',
    text: '{date}の架電ディレクションを作成してください。',
    vars: [
      { key: 'date', label: '対象日', type: 'date_choice' }
    ]
  },
  {
    id: 'assign_manual',
    group: 'ディレクション',
    icon: '✏️',
    label: '手動アサイン指示',
    text: '{member}を{client}の架電に{date}の{time}でアサインしてください。',
    vars: [
      { key: 'member', label: 'メンバー名', type: 'text', placeholder: '例: 山田太郎' },
      { key: 'client', label: 'クライアント名', type: 'text', placeholder: '例: 株式会社○○' },
      { key: 'date', label: '日付', type: 'text', placeholder: '例: 5/20' },
      { key: 'time', label: '時間帯', type: 'select',
        options: ['9時-10時', '10時-11時', '11時-12時', '13時-14時', '14時-15時', '15時-16時', '16時-17時', '17時-18時'] }
    ]
  },
  {
    id: 'check_schedule',
    group: 'ディレクション',
    icon: '🔍',
    label: 'スケジュール確認',
    text: '{member}の{date}のスケジュールを確認してください。',
    vars: [
      { key: 'member', label: 'メンバー名', type: 'text', placeholder: '例: 山田太郎' },
      { key: 'date', label: '対象日', type: 'date_choice' }
    ]
  },
  {
    id: 'shift_change',
    group: 'ディレクション',
    icon: '🔄',
    label: 'シフト変更依頼',
    text: '{member}の{date}のシフトを{change}に変更してください。',
    vars: [
      { key: 'member', label: 'メンバー名', type: 'text', placeholder: '例: 山田太郎' },
      { key: 'date', label: '対象日', type: 'text', placeholder: '例: 5/20' },
      { key: 'change', label: '変更内容', type: 'text', placeholder: '例: 13時〜17時に変更' }
    ]
  },
  {
    id: 'list_members',
    group: 'メンバー管理',
    icon: '👥',
    label: 'メンバー一覧確認',
    text: 'メンバー一覧を見せてください。',
    vars: []
  },
  {
    id: 'update_rank',
    group: 'メンバー管理',
    icon: '⬆️',
    label: '肩書変更',
    text: '{member}の肩書を{rank}に変更してください。',
    vars: [
      { key: 'member', label: 'メンバー名', type: 'text', placeholder: '例: 山田太郎' },
      { key: 'rank', label: '新しい肩書', type: 'select',
        options: ['新人', 'ルーキー', 'プレーヤー', 'サブリーダー', 'リーダー', 'MGR'] }
    ]
  },
  {
    id: 'update_alliance',
    group: 'メンバー管理',
    icon: '🤝',
    label: 'アライアンス設定変更',
    text: '{member}のアライアンス設定を{alliance}に変更してください。',
    vars: [
      { key: 'member', label: 'メンバー名', type: 'text', placeholder: '例: 山田太郎' },
      { key: 'alliance', label: '設定', type: 'select', options: ['有効（TRUE）', '無効（FALSE）'] }
    ]
  },
  {
    id: 'update_business',
    group: 'メンバー管理',
    icon: '🏢',
    label: '担当事業変更',
    text: '{member}の担当事業を{business}に変更してください。',
    vars: [
      { key: 'member', label: 'メンバー名', type: 'text', placeholder: '例: 山田太郎' },
      { key: 'business', label: '担当事業', type: 'text', placeholder: '例: 不動産' }
    ]
  },
  {
    id: 'update_landing',
    group: 'メンバー管理',
    icon: '🎯',
    label: '着地タイプ変更',
    text: '{member}の着地タイプを{landingType}に変更してください。',
    vars: [
      { key: 'member', label: 'メンバー名', type: 'text', placeholder: '例: 山田太郎' },
      { key: 'landingType', label: '着地タイプ', type: 'select',
        options: ['アポ・資料', 'アポのみ', '資料のみ'] }
    ]
  },
  {
    id: 'update_rank_rule',
    group: 'メンバー管理',
    icon: '⚙️',
    label: '稼働ルール設定',
    text: '{rank}の稼働ルールを変更してください。{rule}',
    vars: [
      { key: 'rank', label: '対象肩書', type: 'select',
        options: ['新人', 'ルーキー', 'プレーヤー', 'サブリーダー', 'リーダー', 'MGR'] },
      { key: 'rule', label: 'ルール内容', type: 'textarea',
        placeholder: '例: 着地タイプを「資料のみ」に限定する' }
    ]
  },
  {
    id: 'check_kpi',
    group: '進捗確認',
    icon: '📊',
    label: 'KPI進捗確認',
    text: '{period}の架電KPI進捗を確認してください。',
    vars: [
      { key: 'period', label: '期間', type: 'select', options: ['今日', '今週', '今月'] }
    ]
  },
  {
    id: 'check_result',
    group: '進捗確認',
    icon: '📈',
    label: '個人成績確認',
    text: '{member}の{period}の成績を確認してください。',
    vars: [
      { key: 'member', label: 'メンバー名', type: 'text', placeholder: '例: 山田太郎' },
      { key: 'period', label: '期間', type: 'select', options: ['今日', '今週', '今月'] }
    ]
  },
  {
    id: 'free',
    group: 'その他',
    icon: '💬',
    label: '自由入力',
    text: '{message}',
    vars: [
      { key: 'message', label: 'メッセージ', type: 'textarea', placeholder: '何でも聞いてください…' }
    ]
  }
];

// ===== 日付選択肢生成 =====
function generateDateOptions() {
  var DAY = ['日', '月', '火', '水', '木', '金', '土'];
  var opts = [];
  var today = new Date();
  for (var i = 0; i < 8; i++) {
    var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
    opts.push((d.getMonth() + 1) + '月' + d.getDate() + '日（' + DAY[d.getDay()] + '）');
  }
  return opts;
}

// ===== 状態管理 =====
let conversationId = null;
let selectedTemplate = null;

// ===== 初期化 =====
function initChat() {
  renderTemplateList();
  document.getElementById('chatInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendDirectMessage(); }
  });
}

// ===== テンプレートリスト描画 =====
function renderTemplateList() {
  const groups = {};
  TEMPLATES.forEach(function(t) {
    if (!groups[t.group]) groups[t.group] = [];
    groups[t.group].push(t);
  });
  const container = document.getElementById('templateList');
  container.innerHTML = Object.keys(groups).map(function(g) {
    return '<div class="tmpl-group">' +
      '<div class="tmpl-group-label">' + g + '</div>' +
      groups[g].map(function(t) {
        return '<div class="tmpl-item" id="tmpl-' + t.id + '" onclick="selectTemplate(\'' + t.id + '\')">' +
          '<span class="tmpl-icon">' + t.icon + '</span>' + t.label + '</div>';
      }).join('') + '</div>';
  }).join('');
}

// ===== テンプレート選択 =====
function selectTemplate(id) {
  selectedTemplate = TEMPLATES.find(function(t) { return t.id === id; });
  if (!selectedTemplate) return;
  document.querySelectorAll('.tmpl-item').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('tmpl-' + id).classList.add('active');
  renderVarsForm(selectedTemplate);
}

// ===== 変数フォーム描画 =====
function renderVarsForm(tmpl) {
  const body = document.getElementById('varsBody');
  if (!tmpl.vars.length) {
    body.innerHTML = '<p style="color:var(--text-muted);font-size:13px;padding:8px 0;">' +
      tmpl.icon + ' ' + tmpl.label + '</p>' +
      '<button class="send-btn" onclick="sendTemplate()">送信</button>';
    return;
  }
  body.innerHTML = '<p style="color:var(--text-muted);font-size:13px;margin-bottom:12px;">' +
    tmpl.icon + ' ' + tmpl.label + '</p>' +
    tmpl.vars.map(function(v) { return buildField(v); }).join('') +
    '<button class="send-btn" id="tmplSendBtn" onclick="sendTemplate()">送信</button>';
}

function buildField(v) {
  var label = '<label class="field-label">' + v.label + '<span class="field-required">*</span></label>';
  var input = '';
  if (v.type === 'date_choice') {
    var dateOpts = generateDateOptions();
    input = '<select data-key="' + v.key + '">' +
      dateOpts.map(function(o) { return '<option value="' + o + '">' + o + '</option>'; }).join('') +
      '</select>';
  } else if (v.type === 'select') {
    input = '<select data-key="' + v.key + '">' +
      (v.options || []).map(function(o) { return '<option value="' + o + '">' + o + '</option>'; }).join('') +
      '</select>';
  } else if (v.type === 'textarea') {
    input = '<textarea data-key="' + v.key + '" rows="4" placeholder="' + (v.placeholder || '') + '"></textarea>';
  } else {
    input = '<input type="text" data-key="' + v.key + '" placeholder="' + (v.placeholder || '') + '" />';
  }
  return '<div class="field-group">' + label + input + '</div>';
}

// ===== テンプレート送信 =====
function sendTemplate() {
  if (!selectedTemplate) return;
  var values = {};
  document.querySelectorAll('#varsBody [data-key]').forEach(function(el) {
    values[el.getAttribute('data-key')] = el.value;
  });
  var missing = selectedTemplate.vars.filter(function(v) { return !values[v.key]; });
  if (missing.length > 0) {
    alert('未入力: ' + missing.map(function(v){ return v.label; }).join(', '));
    return;
  }
  var text = selectedTemplate.text;
  Object.keys(values).forEach(function(k) {
    text = text.replace(new RegExp('\\{' + k + '\\}', 'g'), values[k]);
  });
  sendMessage(text);
}

// ===== 直接入力送信 =====
function sendDirectMessage() {
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendMessage(text);
}

// ===== 文字化け（Mojibake）修正 =====
// UTF-8バイト列をLatin-1/Windows-1252として誤解釈された文字列を正しく復元する
const W1252 = {0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,
  0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,
  0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,
  0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};

function charToByte(code) {
  if (code <= 0xFF) return code;
  return W1252[code] !== undefined ? W1252[code] : null;
}

function fixMojibake(str) {
  if (!str) return str;
  var result = '', i = 0;
  while (i < str.length) {
    var code = str.charCodeAt(i);
    var b = charToByte(code);
    if (b !== null && b >= 0xC0 && b <= 0xFD) {
      var seqLen = b >= 0xF0 ? 4 : b >= 0xE0 ? 3 : 2;
      if (i + seqLen <= str.length) {
        var bytes = [b], valid = true;
        for (var j = 1; j < seqLen; j++) {
          var nb = charToByte(str.charCodeAt(i + j));
          if (nb === null || nb < 0x80 || nb > 0xBF) { valid = false; break; }
          bytes.push(nb);
        }
        if (valid) {
          try {
            var decoded = new TextDecoder('utf-8').decode(new Uint8Array(bytes));
            if (decoded && decoded.charCodeAt(0) !== 0xFFFD) {
              result += decoded; i += seqLen; continue;
            }
          } catch(e) {}
        }
      }
    }
    result += str[i]; i++;
  }
  return result;
}

// ===== メッセージ送信（Dify API直接呼び出し）=====
async function sendMessage(text) {
  appendMessage('user', text);
  var typingId = appendTyping();
  setBusy(true);

  try {
    const response = await fetch('https://udify.app/api/chat-messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer SdBVI7rCB2KVCuRv'
      },
      body: JSON.stringify({
        inputs: {},
        query: text,
        response_mode: 'blocking',
        conversation_id: conversationId || '',
        user: 'kaiden-chat-user'
      })
    });

    removeTyping(typingId);
    setBusy(false);

    if (!response.ok) {
      const errText = await response.text();
      appendMessage('bot', '⚠️ エラー (HTTP ' + response.status + '): ' + errText.substring(0, 300));
      return;
    }

    const data = await response.json();
    if (data.conversation_id) conversationId = data.conversation_id;
    appendMessage('bot', fixMojibake(data.answer || '（応答なし）'));

  } catch (err) {
    removeTyping(typingId);
    setBusy(false);
    appendMessage('bot', '⚠️ 通信エラー: ' + err.message);
  }
}

// ===== チャットUI操作 =====
function appendMessage(role, text) {
  var history = document.getElementById('chatHistory');
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="msg-avatar">' + (role === 'user' ? '👤' : '🤖') + '</div>' +
    '<div class="msg-bubble">' + renderMarkdown(text) + '</div>';
  history.appendChild(div);
  history.scrollTop = history.scrollHeight;
}

function appendTyping() {
  var history = document.getElementById('chatHistory');
  var id = 'typing-' + Date.now();
  var div = document.createElement('div');
  div.className = 'msg bot';
  div.id = id;
  div.innerHTML = '<div class="msg-avatar">🤖</div>' +
    '<div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  history.appendChild(div);
  history.scrollTop = history.scrollHeight;
  return id;
}

function removeTyping(id) {
  var el = document.getElementById(id);
  if (el) el.remove();
}

function setBusy(busy) {
  document.getElementById('chatSendBtn').disabled = busy;
  var btn = document.getElementById('tmplSendBtn');
  if (btn) btn.disabled = busy;
}

// ===== 簡易Markdownレンダリング =====
function renderMarkdown(text) {
  text = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  text = text.replace(/(\|.+\|\n)+/g, function(block) {
    var rows = block.trim().split('\n');
    var html = '<table>';
    rows.forEach(function(row, i) {
      if (/^\|[-| ]+\|$/.test(row)) return;
      var cells = row.replace(/^\||\|$/g,'').split('|');
      var tag = (i === 0) ? 'th' : 'td';
      html += '<tr>' + cells.map(function(c){ return '<'+tag+'>'+c.trim()+'</'+tag+'>'; }).join('') + '</tr>';
    });
    return html + '</table>';
  });
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/`(.+?)`/g, '<code>$1</code>');
  text = text.replace(/\n/g, '<br>');
  return text;
}

if (sessionStorage.getItem(SESSION_KEY) === '1') showChat();
